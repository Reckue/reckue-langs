<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reckue Languages</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            width: 360px;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 14px;
        }
        .wrapper { display: flex; flex-direction: column; min-height: 360px; }
        .navbar {
            display: flex;
            gap: 4px;
            padding: 8px;
            border-bottom: 1px solid rgba(0, 0, 0, .12);
        }
        .navbar button {
            flex: 1;
            padding: 6px 8px;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, .15);
            border-radius: 6px;
            background: transparent;
        }
        .navbar button:disabled { background: #1e81c6; color: #fff; cursor: default; }
        .content { flex: 1; overflow-y: auto; padding: 8px; }

        .header { margin-bottom: 8px; }
        .filter input { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(0,0,0,.2); }
        .word { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        /* min-width:0 — иначе flex-элемент не сжимается и длинное слово ломает строку */
        .word .clear { flex: 1; min-width: 0; padding: 4px 6px; border-radius: 4px; border: 1px solid rgba(0,0,0,.15); }

        .level-slider { display: flex; align-items: center; gap: 8px; width: 116px; height: 20px; cursor: pointer; user-select: none; flex-shrink: 0; }
        .level-slider-track { position: relative; flex: 1; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; }
        .level-slider-fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 3px; transition: width .1s ease, background-color .1s ease; }
        .level-slider-value { font-size: 12px; font-weight: 600; min-width: 10px; text-align: center; opacity: .8; }

        #pages { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
        #pages .page { cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        #pages .page.active { background: #1e81c6; color: #fff; }

        .settings .title { font-weight: 600; margin: 8px 0 4px; opacity: .7; }
        .enable { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; cursor: pointer; }
        .lever {
            display: flex;
            align-items: center;
            width: 48px;
            height: 22px;
            border-radius: 999px;
            border: 1px solid rgba(0,0,0,.25);
            transition: background .15s;
        }
        .slider {
            font-size: 9px;
            line-height: 20px;
            padding: 0 4px;
            border-radius: 999px;
            background: #1e81c6;
            color: #fff;
        }

        .infobar {
            padding: 6px 8px;
            font-size: 11px;
            opacity: .6;
            text-align: right;
            border-top: 1px solid rgba(0, 0, 0, .12);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="popup.js"></script>
</body>
</html>
